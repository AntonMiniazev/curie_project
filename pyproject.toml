[project]
name = "curie-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "deltalake>=1.6.0",
    "duckdb>=1.5.3",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "apps/streamlit",
]
include = [
    "shared*",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "apps/streamlit",
]
testpaths = [
    "apps/api/tests",
]
