limit_req_zone $binary_remote_addr zone=curie_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=curie_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=curie_admin:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=curie_streamlit_conn:10m;
limit_req_status 429;

server {

    server_name ampere-data.work www.ampere-data.work;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=curie_auth burst=5 nodelay;
        proxy_pass http://100.65.42.72:8000/api/auth/login;
    }

    location = /api/auth/register {
        limit_req zone=curie_auth burst=3 nodelay;
        proxy_pass http://100.65.42.72:8000/api/auth/register;
    }

    location = /api/cache/refresh {
        limit_req zone=curie_admin burst=1 nodelay;
        proxy_pass http://100.65.42.72:8000/api/cache/refresh;
    }

    location /api/ {
        limit_req zone=curie_api burst=30 nodelay;
        proxy_pass http://100.65.42.72:8000/api/;
    }

    location = /api {
        proxy_pass http://100.65.42.72:8000/api;
    }

    location /streamlit/ {
        limit_conn curie_streamlit_conn 20;
        auth_request /_curie_streamlit_auth;
        auth_request_set $curie_streamlit_scope $upstream_http_x_curie_streamlit_scope;
        proxy_set_header X-Curie-Streamlit-Scope $curie_streamlit_scope;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_pass http://100.65.42.72:8501;
    }

    location = /_curie_streamlit_auth {
        internal;
        proxy_pass http://100.65.42.72:8000/api/auth/nginx-streamlit;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ampere-data.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ampere-data.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.ampere-data.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ampere-data.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;

    server_name ampere-data.work www.ampere-data.work;
    return 404; # managed by Certbot




}
