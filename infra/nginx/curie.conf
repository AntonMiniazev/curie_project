limit_req_zone $binary_remote_addr zone=curie_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=curie_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=curie_admin:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=curie_streamlit_conn:10m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.ampere-data.work;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    ssl_certificate /etc/letsencrypt/live/ampere-data.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ampere-data.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://ampere-data.work$request_uri;
}

server {
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot

    server_name ampere-data.work;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /api/auth/login {
        limit_req zone=curie_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/login;
    }

    location = /api/auth/register {
        limit_req zone=curie_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/register;
    }

    location = /api/docs {
        return 404;
    }

    location = /api/redoc {
        return 404;
    }

    location = /api/openapi.json {
        return 404;
    }

    location = /api/cache {
        return 404;
    }

    location /api/cache/ {
        return 404;
    }

    location /api/check {
        return 404;
    }

    location /api/ {
        limit_req zone=curie_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    location = /api {
        limit_req zone=curie_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000/api;
    }

    location /streamlit/ {
        proxy_http_version 1.1;
        limit_conn curie_streamlit_conn 20;
        auth_request /_curie_streamlit_auth;
        auth_request_set $curie_streamlit_scope $upstream_http_x_curie_streamlit_scope;
        proxy_set_header X-Curie-Streamlit-Scope $curie_streamlit_scope;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_pass http://127.0.0.1:8501;
    }

    location = /_curie_streamlit_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/nginx-streamlit;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    ssl_certificate /etc/letsencrypt/live/ampere-data.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ampere-data.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;

    server_name www.ampere-data.work;

    return 301 https://ampere-data.work$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name ampere-data.work;

    return 301 https://ampere-data.work$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/cache/refresh {
        allow 100.118.58.111;
        allow 100.86.133.66;
        allow 100.65.42.72;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=curie_admin burst=1 nodelay;
        proxy_pass http://127.0.0.1:8000/api/cache/refresh;
    }

    location /api/cache/ {
        allow 100.118.58.111;
        allow 100.86.133.66;
        allow 100.65.42.72;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=curie_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000/api/cache/;
    }

    location / {
        return 404;
    }
}
