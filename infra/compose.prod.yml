name: curie-prod

services:
  web:
    image: ${CURIE_WEB_IMAGE:-ghcr.io/antonminiazev/curie-web:latest}
    container_name: curie-web-prod
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      PUBLIC_STREAMLIT_BASE_URL: ${PUBLIC_STREAMLIT_BASE_URL:-/streamlit}
    ports:
      - "${CURIE_WEB_PORT:-127.0.0.1:3000}:3000"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: curie-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - curie-postgres-prod-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CURIE_POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${CURIE_IMAGE:-ghcr.io/antonminiazev/curie-api:latest}
    container_name: curie-api-prod
    restart: unless-stopped
    env_file:
      - ${CURIE_ENV_FILE:-./env/curie-prod.env}
    environment:
      CURIE_CACHE_REFRESH_ENABLED: "true"
      CURIE_CACHE_REFRESH_IMAGE: ${CURIE_IMAGE:-ghcr.io/antonminiazev/curie-api:latest}
      CURIE_CACHE_REFRESH_NETWORK: curie-prod_default
      CURIE_FLIGHTSQL_URI: flightsql://ampere-flight-sql.tail8f7784.ts.net:8815?transport=tcp
      CURIE_FLIGHTSQL_TIMEOUT_SECONDS: "30"
      CURIE_FLIGHTSQL_FETCH_TIMEOUT_SECONDS: "300"
      CURIE_SERVING_CACHE_ROOT: /app/data/serving-cache
      CURIE_SERVING_CACHE_CURRENT: /app/data/serving-cache/current
      CURIE_SERVING_HOST_CACHE_DIR: ${CURIE_SERVING_HOST_CACHE_DIR:-/var/lib/curie/serving-cache}
    ports:
      - "${CURIE_API_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - ${CURIE_SERVING_HOST_CACHE_DIR:-/var/lib/curie/serving-cache}:/app/data/serving-cache
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    image: ${CURIE_STREAMLIT_IMAGE:-ghcr.io/antonminiazev/curie-streamlit:latest}
    container_name: curie-streamlit-prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      CURIE_SERVING_CACHE_CURRENT: /app/data/serving-cache/current
      CURIE_JWT_SECRET_KEY: ${CURIE_JWT_SECRET_KEY}
      CURIE_JWT_ALGORITHM: ${CURIE_JWT_ALGORITHM:-HS256}
      CURIE_AUTH_ACCESS_COOKIE_NAME: ${CURIE_AUTH_ACCESS_COOKIE_NAME:-curie_access_token}
      STREAMLIT_SERVER_BASE_URL_PATH: ${STREAMLIT_SERVER_BASE_URL_PATH:-streamlit}
      STREAMLIT_CLIENT_TOOLBAR_MODE: minimal
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_THEME_BASE: light
    ports:
      - "${CURIE_STREAMLIT_PORT:-127.0.0.1:8501}:8501"
    volumes:
      - ${CURIE_SERVING_HOST_CACHE_DIR:-/var/lib/curie/serving-cache}:/app/data/serving-cache:ro
    depends_on:
      api:
        condition: service_started

  flightsql-cache-refresh:
    image: ${CURIE_IMAGE:-ghcr.io/antonminiazev/curie-api:latest}
    profiles: ["flightsql-cache"]
    environment:
      APP_ENV: prod
      CURIE_FLIGHTSQL_URI: flightsql://ampere-flight-sql.tail8f7784.ts.net:8815?transport=tcp
      CURIE_FLIGHTSQL_AUTH_TOKEN: ${CURIE_FLIGHTSQL_AUTH_TOKEN}
      CURIE_FLIGHTSQL_TIMEOUT_SECONDS: "30"
      CURIE_FLIGHTSQL_FETCH_TIMEOUT_SECONDS: "300"
      CURIE_SERVING_CACHE_ROOT: /app/data/serving-cache
      CURIE_SERVING_CACHE_CURRENT: /app/data/serving-cache/current
    command: ["uv", "run", "python", "-m", "apps.api.cache.refresh_flightsql"]
    mem_limit: 2g
    cpus: 1.5
    volumes:
      - ${CURIE_SERVING_HOST_CACHE_DIR:-/var/lib/curie/serving-cache}:/app/data/serving-cache

volumes:
  curie-postgres-prod-data:
