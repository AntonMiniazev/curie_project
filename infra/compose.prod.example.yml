name: curie-prod

services:
  postgres:
    image: postgres:16
    container_name: curie-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - curie-postgres-prod-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CURIE_POSTGRES_PORT:-100.65.42.72:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${CURIE_IMAGE:-ghcr.io/OWNER/curie-api:latest}
    container_name: curie-api-prod
    restart: unless-stopped
    env_file:
      - ${CURIE_ENV_FILE:-./env/curie-prod.env}
    environment:
      CURIE_CACHE_ROOT: /app/data/cache
      CURIE_CACHE_CURRENT: /app/data/cache/current
      CURIE_CACHE_REFRESH_ENABLED: "true"
      CURIE_CACHE_REFRESH_IMAGE: ${CURIE_IMAGE:-ghcr.io/antonminiazev/curie-api:latest}
      CURIE_CACHE_REFRESH_HOST_CACHE_DIR: ${CURIE_HOST_CACHE_DIR:-/var/lib/curie/cache}
      CURIE_CACHE_REFRESH_VOLUMES_FROM: curie-api-prod
      CURIE_CACHE_REFRESH_NETWORK: curie-prod_default
    ports:
      - "${CURIE_API_PORT:-8000}:8000"
    volumes:
      - ${CURIE_HOST_CACHE_DIR:-/var/lib/curie/cache}:/app/data/cache
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "ucatalog.local:${CURIE_UPSTREAM_HOST_IP:-100.86.133.66}"
      - "s3.minio.local:${CURIE_UPSTREAM_HOST_IP:-100.86.133.66}"
      - "minio.local:${CURIE_UPSTREAM_HOST_IP:-100.86.133.66}"
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    image: ${CURIE_STREAMLIT_IMAGE:-ghcr.io/OWNER/curie-streamlit:latest}
    container_name: curie-streamlit-prod
    restart: unless-stopped
    env_file:
      - ${CURIE_ENV_FILE:-./env/curie-prod.env}
    environment:
      CURIE_CACHE_CURRENT: /app/data/cache/current
      CURIE_JWT_SECRET_KEY: ${CURIE_JWT_SECRET_KEY}
      CURIE_JWT_ALGORITHM: ${CURIE_JWT_ALGORITHM:-HS256}
    ports:
      - "${CURIE_STREAMLIT_PORT:-100.65.42.72:8501}:8501"
    volumes:
      - ${CURIE_HOST_CACHE_DIR:-/var/lib/curie/cache}:/app/data/cache:ro
    depends_on:
      api:
        condition: service_started

  cache-refresh:
    image: ${CURIE_IMAGE:-ghcr.io/OWNER/curie-api:latest}
    profiles: ["cache"]
    env_file:
      - ${CURIE_ENV_FILE:-./env/curie-prod.env}
    environment:
      CURIE_CACHE_ROOT: /app/data/cache
      CURIE_CACHE_CURRENT: /app/data/cache/current
    command: ["uv", "run", "python", "-m", "apps.api.cache.refresh"]
    volumes:
      - ${CURIE_HOST_CACHE_DIR:-/var/lib/curie/cache}:/app/data/cache
    extra_hosts:
      - "ucatalog.local:${CURIE_UPSTREAM_HOST_IP:-100.86.133.66}"
      - "s3.minio.local:${CURIE_UPSTREAM_HOST_IP:-100.86.133.66}"
      - "minio.local:${CURIE_UPSTREAM_HOST_IP:-100.86.133.66}"

volumes:
  curie-postgres-prod-data:
