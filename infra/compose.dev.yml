name: curie-dev

services:
  postgres:
    image: postgres:16
    container_name: curie-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - curie-postgres-dev-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${CURIE_IMAGE:-curie-api:dev}
    container_name: curie-api-dev
    profiles: ["api"]
    restart: unless-stopped
    command:
      - sh
      - -ec
      - cd /app/apps/api && uv run alembic upgrade head && cd /app && exec uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./env/curie-dev.env
    environment:
      CURIE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CURIE_CACHE_REFRESH_ENABLED: "true"
      CURIE_CACHE_REFRESH_IMAGE: ${CURIE_IMAGE:-curie-api:dev}
      CURIE_CACHE_REFRESH_NETWORK: curie-dev_default
      CURIE_SERVING_CACHE_ROOT: /app/data/serving-cache
      CURIE_SERVING_CACHE_CURRENT: /app/data/serving-cache/current
      CURIE_SERVING_HOST_CACHE_DIR: curie-dev-serving-cache
    ports:
      - "8000:8000"
    volumes:
      - curie-dev-serving-cache:/app/data/serving-cache
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  flightsql-cache-refresh:
    image: ${CURIE_IMAGE:-curie-api:dev}
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["flightsql-cache"]
    env_file:
      - ./env/curie-dev.env
    environment:
      CURIE_SERVING_CACHE_ROOT: /app/data/serving-cache
      CURIE_SERVING_CACHE_CURRENT: /app/data/serving-cache/current
    command: ["uv", "run", "python", "-m", "apps.api.cache.refresh_flightsql"]
    mem_limit: 2g
    cpus: 1.5
    volumes:
      - curie-dev-serving-cache:/app/data/serving-cache

  streamlit:
    build:
      context: ..
      dockerfile: apps/streamlit/Dockerfile
    image: ${CURIE_STREAMLIT_IMAGE:-curie-streamlit:dev}
    container_name: curie-streamlit-dev
    profiles: ["streamlit"]
    restart: unless-stopped
    environment:
      APP_ENV: dev
      CURIE_SERVING_CACHE_CURRENT: /app/data/serving-cache/current
      CURIE_JWT_SECRET_KEY: ${CURIE_JWT_SECRET_KEY}
      CURIE_JWT_ALGORITHM: ${CURIE_JWT_ALGORITHM:-HS256}
      CURIE_AUTH_ACCESS_COOKIE_NAME: ${CURIE_AUTH_ACCESS_COOKIE_NAME:-curie_access_token}
      STREAMLIT_CLIENT_TOOLBAR_MODE: minimal
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_THEME_BASE: light
    ports:
      - "8501:8501"
    volumes:
      - curie-dev-serving-cache:/app/data/serving-cache:ro

volumes:
  curie-postgres-dev-data:
  curie-dev-serving-cache:
    name: curie-dev-serving-cache
