name: Deploy API
run-name: ${{ github.event_name == 'workflow_run' && 'Deploy API after API Image' || 'Deploy API direct' }}

on:
  push:
    branches:
      - main
    paths:
      - infra/compose.prod.yml
      - infra/env/curie-prod.sops.env
      - .sops.yaml
      - .github/workflows/deploy-api.yml
  workflow_run:
    workflows:
      - API Image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  CURIE_DEPLOY_HOST: 46.62.243.229
  CURIE_DEPLOY_USER: root
  CURIE_DEPLOY_DIR: /opt/curie
  CURIE_TAILSCALE_API_URL: http://100.65.42.72:8000/api/health

jobs:
  deploy:
    name: ${{ github.event_name == 'workflow_run' && 'Deploy API after image build' || 'Deploy API direct' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check push deploy eligibility
        id: deploy_gate
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed_files"

          if echo "$changed_files" | grep -E '^(Dockerfile|pyproject\.toml|uv\.lock|apps/api/|infra/certs/|\.github/workflows/api-image\.yml)'; then
            echo "Push changed API image inputs; deploy will wait for API Image workflow_run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Azure for SOPS
        if: steps.deploy_gate.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install SOPS
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          curl --fail --location --output /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64
          chmod +x /usr/local/bin/sops
          sops --version

      - name: Configure SSH
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CURIE_DEPLOY_SSH_KEY }}" > ~/.ssh/curie_deploy_key
          chmod 600 ~/.ssh/curie_deploy_key
          ssh-keyscan -H "$CURIE_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy compose file
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          scp -i ~/.ssh/curie_deploy_key \
            infra/compose.prod.yml \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/compose.yml"
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "mkdir -p $CURIE_DEPLOY_DIR/postgres/initdb"
          scp -i ~/.ssh/curie_deploy_key \
            infra/postgres/initdb/* \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/postgres/initdb/"

      - name: Decrypt and copy prod env
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          mkdir -p .deploy
          sops --decrypt \
            --input-type dotenv \
            --output-type dotenv \
            infra/env/curie-prod.sops.env > .deploy/curie-prod.env
          chmod 600 .deploy/curie-prod.env
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "mkdir -p $CURIE_DEPLOY_DIR/env && chmod 700 $CURIE_DEPLOY_DIR/env"
          scp -i ~/.ssh/curie_deploy_key \
            .deploy/curie-prod.env \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/env/curie-prod.env"
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "chmod 600 $CURIE_DEPLOY_DIR/env/curie-prod.env"
          rm -f .deploy/curie-prod.env

      - name: Deploy API
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "cd $CURIE_DEPLOY_DIR \
            && docker compose --env-file env/curie-prod.env -f compose.yml pull api \
            && docker compose --env-file env/curie-prod.env -f compose.yml run --rm api sh -c 'cd apps/api && uv run alembic upgrade head' \
            && docker compose --env-file env/curie-prod.env -f compose.yml up -d --force-recreate api \
            && docker image prune -f \
            && docker port curie-api-prod"

      - name: Verify API on server
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "for attempt in \$(seq 1 30); do \
              if curl --fail --show-error --silent '$CURIE_TAILSCALE_API_URL'; then break; fi; \
              if [ \"\$attempt\" -eq 30 ]; then echo 'API did not become healthy in time'; exit 1; fi; \
              sleep 2; \
            done \
            && docker port curie-api-prod | grep '100.65.42.72:8000'"

      - name: Verify public API port stays closed
        if: steps.deploy_gate.outputs.skip != 'true'
        run: |
          if curl --fail --silent --show-error --connect-timeout 5 "http://$CURIE_DEPLOY_HOST:8000/api/health"; then
            echo "Public API port 8000 is reachable; expected it to stay closed."
            exit 1
          fi
