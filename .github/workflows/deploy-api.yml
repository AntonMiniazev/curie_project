name: Deploy API
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Deploy Curie services manual' || 'Deploy Curie services after API Image' }}

on:
  workflow_run:
    workflows:
      - API Image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  CURIE_DEPLOY_HOST: 46.62.243.229
  CURIE_PUBLIC_DOMAIN: ampere-data.work
  CURIE_DEPLOY_USER: root
  CURIE_DEPLOY_DIR: /opt/curie

jobs:
  deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Deploy Curie services manual' || 'Deploy Curie services after image build' }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v5

      - name: Authenticate to Azure for SOPS
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install SOPS
        run: |
          curl --fail --location --output /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64
          chmod +x /usr/local/bin/sops
          sops --version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CURIE_DEPLOY_SSH_KEY }}" > ~/.ssh/curie_deploy_key
          chmod 600 ~/.ssh/curie_deploy_key
          ssh-keyscan -H "$CURIE_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          scp -i ~/.ssh/curie_deploy_key \
            infra/compose.prod.yml \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/compose.yml"
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "mkdir -p $CURIE_DEPLOY_DIR/postgres/initdb $CURIE_DEPLOY_DIR/nginx/stream"
          scp -i ~/.ssh/curie_deploy_key \
            infra/postgres/initdb/* \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/postgres/initdb/"
          scp -i ~/.ssh/curie_deploy_key \
            infra/nginx/curie.conf \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/nginx/curie.conf"
          scp -i ~/.ssh/curie_deploy_key \
            infra/nginx/stream/curie-postgres.conf \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/nginx/stream/curie-postgres.conf"

      - name: Decrypt and copy prod env
        run: |
          mkdir -p .deploy
          umask 077
          sops --decrypt \
            --input-type dotenv \
            --output-type dotenv \
            infra/env/curie-prod.sops.env > .deploy/curie-prod.env
          lakekeeper_client_id="$(az keyvault secret show --vault-name az-ampere-kv --name ampere-iceberg-curie-clientid --query value --output tsv)"
          lakekeeper_client_secret="$(az keyvault secret show --vault-name az-ampere-kv --name ampere-iceberg-curie-secret --query value --output tsv)"
          minio_access_key="$(az keyvault secret show --vault-name az-ampere-kv --name ampere-iceberg-minio-access-key --query value --output tsv)"
          minio_secret_key="$(az keyvault secret show --vault-name az-ampere-kv --name ampere-iceberg-minio-secret-key --query value --output tsv)"
          echo "::add-mask::$lakekeeper_client_id"
          echo "::add-mask::$lakekeeper_client_secret"
          echo "::add-mask::$minio_access_key"
          echo "::add-mask::$minio_secret_key"
          export CURIE_LAKEKEEPER_CLIENT_ID="$lakekeeper_client_id"
          export CURIE_LAKEKEEPER_CLIENT_SECRET="$lakekeeper_client_secret"
          export CURIE_MINIO_ACCESS_KEY="$minio_access_key"
          export CURIE_MINIO_SECRET_KEY="$minio_secret_key"
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path('.deploy/curie-prod.env')
          updates = {
              key: os.environ[key]
              for key in (
                  'CURIE_LAKEKEEPER_CLIENT_ID',
                  'CURIE_LAKEKEEPER_CLIENT_SECRET',
                  'CURIE_MINIO_ACCESS_KEY',
                  'CURIE_MINIO_SECRET_KEY',
              )
          }
          lines = env_file.read_text(encoding='utf-8').splitlines()
          written = set()
          output = []
          for line in lines:
              key = line.partition('=')[0]
              if key in updates:
                  if key not in written:
                      output.append(f'{key}={updates[key]}')
                      written.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in written:
                  output.append(f'{key}={value}')
          env_file.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          unset lakekeeper_client_id lakekeeper_client_secret minio_access_key minio_secret_key
          unset CURIE_LAKEKEEPER_CLIENT_ID CURIE_LAKEKEEPER_CLIENT_SECRET CURIE_MINIO_ACCESS_KEY CURIE_MINIO_SECRET_KEY
          chmod 600 .deploy/curie-prod.env
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "mkdir -p $CURIE_DEPLOY_DIR/env && chmod 700 $CURIE_DEPLOY_DIR/env"
          scp -i ~/.ssh/curie_deploy_key \
            .deploy/curie-prod.env \
            "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST:$CURIE_DEPLOY_DIR/env/curie-prod.env"
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "chmod 600 $CURIE_DEPLOY_DIR/env/curie-prod.env"
          rm -f .deploy/curie-prod.env

      - name: Deploy web, API, and Streamlit
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "cd $CURIE_DEPLOY_DIR \
            && docker compose --env-file env/curie-prod.env -f compose.yml pull web api streamlit \
            && docker compose --env-file env/curie-prod.env -f compose.yml run --rm api sh -c 'cd apps/api && uv run alembic upgrade head' \
            && docker compose --env-file env/curie-prod.env -f compose.yml up -d --force-recreate web api streamlit \
            && docker image prune -f \
            && docker port curie-web-prod \
            && docker port curie-api-prod \
            && docker port curie-streamlit-prod"

      - name: Configure Nginx
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "cp $CURIE_DEPLOY_DIR/nginx/curie.conf /etc/nginx/sites-available/curie \
            && mkdir -p /etc/nginx/stream-enabled \
            && cp $CURIE_DEPLOY_DIR/nginx/stream/curie-postgres.conf /etc/nginx/stream-enabled/curie-postgres.conf \
            && if ! grep -q 'include /etc/nginx/stream-enabled/\\*.conf;' /etc/nginx/nginx.conf; then sed -i '/^http {/i stream {\\n    include /etc/nginx/stream-enabled/*.conf;\\n}\\n' /etc/nginx/nginx.conf; fi \
            && ln -sf /etc/nginx/sites-available/curie /etc/nginx/sites-enabled/curie \
            && rm -f /etc/nginx/sites-enabled/default \
            && nginx -t \
            && systemctl reload nginx"

      - name: Verify API on server
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "for attempt in \$(seq 1 30); do \
              if docker exec curie-api-prod curl --fail --silent --output /tmp/curie-health.json http://127.0.0.1:8000/api/health; then \
                cat /tmp/curie-health.json; \
                exit 0; \
              fi; \
              if [ \"\$attempt\" -eq 30 ]; then echo 'API did not become healthy in time'; exit 1; fi; \
              sleep 2; \
            done"

      - name: Verify Streamlit on server
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "for attempt in \$(seq 1 30); do \
              if docker exec curie-streamlit-prod curl --fail --silent --output /tmp/curie-streamlit.html http://127.0.0.1:8501/streamlit/; then \
                echo 'Streamlit responded inside container'; \
                exit 0; \
              fi; \
              if [ \"\$attempt\" -eq 30 ]; then echo 'Streamlit did not become ready in time'; exit 1; fi; \
              sleep 2; \
            done"

      - name: Verify web through Nginx
        run: |
          ssh -i ~/.ssh/curie_deploy_key "$CURIE_DEPLOY_USER@$CURIE_DEPLOY_HOST" \
            "for attempt in \$(seq 1 30); do \
              if curl --fail --silent --location --output /tmp/curie-web.html --header 'Host: $CURIE_PUBLIC_DOMAIN' http://127.0.0.1/; then \
                echo 'Web responded through Nginx'; \
                exit 0; \
              fi; \
              if [ \"\$attempt\" -eq 30 ]; then echo 'Web did not become ready through Nginx'; exit 1; fi; \
              sleep 2; \
            done"
          curl --fail --silent --location --output /tmp/curie-public-web.html "https://$CURIE_PUBLIC_DOMAIN/"
          curl --fail --silent --output /dev/null "http://$CURIE_PUBLIC_DOMAIN/"

      - name: Verify API through Nginx
        run: |
          curl --fail --silent --output /tmp/curie-public-health.json "https://$CURIE_PUBLIC_DOMAIN/api/health"
          cat /tmp/curie-public-health.json

      - name: Verify public API port stays closed
        run: |
          if curl --fail --silent --output /dev/null --connect-timeout 5 "http://$CURIE_DEPLOY_HOST:8000/api/health"; then
            echo "Public API port 8000 is reachable; expected it to stay closed."
            exit 1
          fi
          echo "Public API port 8000 is not reachable, as expected."

      - name: Verify public Streamlit port stays closed
        run: |
          if curl --fail --silent --output /dev/null --connect-timeout 5 "http://$CURIE_DEPLOY_HOST:8501/"; then
            echo "Public Streamlit port 8501 is reachable; expected it to stay closed."
            exit 1
          fi
          echo "Public Streamlit port 8501 is not reachable, as expected."
