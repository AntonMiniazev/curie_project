name: API Image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE_NAME: ghcr.io/antonminiazev/curie-api
  STREAMLIT_IMAGE_NAME: ghcr.io/antonminiazev/curie-streamlit
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/streamlit/Dockerfile
          push: true
          tags: |
            ${{ env.STREAMLIT_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.STREAMLIT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=streamlit
          cache-to: type=gha,scope=streamlit,mode=max
